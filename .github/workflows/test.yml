name: Test

on:
  push:
    branches:
      - '**'
    # Only build/test when something that affects the Go module changes.
    # cmd/** and internal/** are matched wholesale so embedded data
    # (internal/catalog/codexdata) and testdata fixtures are covered too.
    # Path filters apply to `push` only; `workflow_call` from release.yml
    # always runs.
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - .github/workflows/test.yml
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./... -count=1
